name: Supabase keepalive

on:
  schedule:
    # Supabaseの無料プロジェクトは7日間APIアクセスがないと自動停止するため、
    # 余裕を持って3日おきにpingしてリセットする
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set yet; skipping."
            exit 0
          fi
          curl -sf "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY"
